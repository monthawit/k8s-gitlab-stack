#
#helm upgrade --install gitlab-redis \
#  bitnami/redis \
#  --namespace gitlab \
#  -f redis-values.yaml
#
#========== redis secret ==========
#
#kubectl create secret generic gitlab-redis-password \
#  -n gitlab \
#  --from-literal=password='CHANGE-ME-REDIS-PASSWORD'
#
# ========= config ong gitlab helm values ========
#global:
#  redis:
#    host: gitlab-redis-master.gitlab.svc.cluster.local
#    port: 6379
#    auth:
#      enabled: true
#      secret: gitlab-redis-password
#      key: password
#
#==============================================
#
#
architecture: standalone

# No image.tag pinned below, so this tracks whatever the bitnami/redis
# chart's default appVersion is at install time rather than the
# Redis 7.2 called out in install-redis.txt. Pin it explicitly, e.g.:
# image:
#   tag: 7.2.x

auth:
  enabled: true
  password: CHANGE-ME-REDIS-PASSWORD

master:
  persistence:
    enabled: true
    storageClass: ceph-block
    size: 20Gi

  resources:
    requests:
      cpu: 250m
      memory: 512Mi

    limits:
      cpu: 1
      memory: 2Gi
